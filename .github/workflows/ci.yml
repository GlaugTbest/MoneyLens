name: MVP checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      # Audit is informational while the Nest 10 migration is outside this sandbox MVP.
      - name: Dependency advisory report
        run: npm audit --omit=dev
        continue-on-error: true
